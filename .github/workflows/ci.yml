name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/panops

jobs:

  # ── Validation ────────────────────────────────────────────────────────────────

  validate-sigma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: |
          python3 - <<'PYEOF'
          import glob, yaml, sys
          errors = []
          for path in glob.glob("rules/sigma/rules/**/*.yaml", recursive=True):
              try:
                  with open(path) as f:
                      docs = list(yaml.safe_load_all(f))
                  for doc in docs:
                      if not doc:
                          continue
                      assert doc.get("title"), f"{path}: missing title"
                      if doc.get("correlation"):
                          continue
                      has_detection = doc.get("detection") or doc.get("x-panops-chsql")
                      assert has_detection, f"{path}: missing detection or x-panops-chsql"
                      assert doc.get("logsource"), f"{path}: missing logsource"
              except AssertionError as e:
                  errors.append(str(e))
              except Exception as e:
                  errors.append(f"{path}: {e}")
          for path in glob.glob("rules/sigma/pipelines/*.yaml"):
              try:
                  yaml.safe_load(open(path))
              except Exception as e:
                  errors.append(f"{path}: {e}")
          if errors:
              print("Sigma validation errors:", *errors, sep="\n  ")
              sys.exit(1)
          rule_count = len(glob.glob("rules/sigma/rules/**/*.yaml", recursive=True))
          print(f"Sigma: {rule_count} rules OK")
          PYEOF

  validate-yara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y yara
      - run: |
          find rules/yara -name "*.yar" -exec yara {} /dev/null \;
          echo "YARA: $(find rules/yara -name '*.yar' | wc -l) rules OK"

  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/validate-schema.py 2>/dev/null || echo "No schema validator found"

  validate-assembler-cm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check assembler CM is in sync
        run: |
          python3 tools/gen-assembler-cm.py > /tmp/assembler-cm-fresh.yaml
          diff deploy/kustomize/components/panops/assembler/assembler-cm.yaml /tmp/assembler-cm-fresh.yaml \
            && echo "CM in sync" || (echo "CM drift detected — run: python3 tools/gen-assembler-cm.py > deploy/kustomize/components/panops/assembler/assembler-cm.yaml"; exit 1)

  validate-no-plaintext-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -rn "ENC\[AES256_GCM" --include="*.yaml" . ; then
            echo "SOPS ciphertext found — remove before publishing"
            exit 1
          fi
          echo "No plaintext secrets found"

  # ── Build & Push (main branch only) ──────────────────────────────────────────

  build-images:
    runs-on: ubuntu-latest
    needs: [validate-sigma, validate-yara, validate-assembler-cm, validate-no-plaintext-secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - name: assembler
            context: docker/assembler
          - name: sigma-scanner
            context: docker/sigma-scanner
          - name: drain3-miner
            context: docker/drain3-miner
          - name: agent
            context: docker/agent
          - name: memory-mcp
            context: docker/memory-mcp
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download yr binary (sigma-scanner only)
        if: matrix.name == 'sigma-scanner'
        run: |
          ARCH=$(uname -m)
          VERSION="v1.19.0"
          wget -qO /tmp/yr.tar.gz \
            "https://github.com/VirusTotal/yara-x/releases/download/${VERSION}/yara-x-${VERSION}-${ARCH}-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/yr.tar.gz -C docker/sigma-scanner/ yr
          chmod +x docker/sigma-scanner/yr
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Integration Tests ─────────────────────────────────────────────────────────

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start core stack
        run: |
          cd deploy/docker-compose
          cp .env.example .env
          docker compose up -d --wait
      - name: Dump logs on failure
        if: failure()
        run: |
          cd deploy/docker-compose
          echo "=== assembler ===" && docker compose logs panops-assembler
          echo "=== schema ===" && docker compose logs panops-schema
          echo "=== clickhouse ===" && docker compose logs clickhouse --tail=30
      - name: Run test harness
        env:
          ASSEMBLER_URL: http://localhost:8080
          CH_URL: http://localhost:8123
          CH_USER: default
          CH_PASSWORD: CHANGE_ME_strong_password_here
        run: |
          pip install pytest requests clickhouse-driver
          pytest tests/test_00_connectivity.py tests/test_01_pipeline.py -v \
            -k "not llama and not heartbeat"
      - name: Teardown
        if: always()
        run: cd deploy/docker-compose && docker compose down -v
