apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: panops-assembler-availability
  labels:
    team: platform
    tier: critical
spec:
  target: "99"
  window: 4w
  description: "99% of PanOps assembler webhook requests succeed"
  indicator:
    ratio:
      errors:
        metric: http_requests_total{job="panops-assembler",status=~"5.."}
      total:
        metric: http_requests_total{job="panops-assembler"}
  alerting:
    name: XOpsAssemblerHighErrorRate
    labels:
      severity: warning
