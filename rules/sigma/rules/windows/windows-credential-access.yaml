title: Windows Credential Access — Multiple Failed Logons
name: windows_credential_access_brute
status: stable
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    LogonType: 3
  condition: selection
level: low
tags:
  - attack.credential_access
  - attack.t1110
---
title: LSASS Memory Access Attempt
name: windows_lsass_access
status: stable
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1010'
      - '0x1410'
  condition: selection
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
---
title: Brute Force Attack — Many Failed Logons by Same User
status: stable
correlation:
  type: event_count
  rules:
    - windows_credential_access_brute
  group-by:
    - SubjectUserName
    - IpAddress
  timespan: 10m
  condition:
    gte: 10
level: high
tags:
  - attack.credential_access
  - attack.t1110
