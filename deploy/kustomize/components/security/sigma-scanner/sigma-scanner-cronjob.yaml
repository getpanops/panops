apiVersion: batch/v1
kind: CronJob
metadata:
  name: sigma-scanner
  namespace: security
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app: sigma-scanner
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scanner
              image: ghcr.io/getpanops/panops/sigma-scanner:latest
              command: [python3, /scripts/sigma-scanner.py]
              env:
                - name: LOKI_URL
                  value: "http://gigapipe.observability.svc.cluster.local:3100"
                - name: CH_URL
                  value: "http://observability-clickhouse-clickhouse-headless.observability.svc.cluster.local:8123/"
                - name: CH_USER
                  value: "default"
                - name: CH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-password
                      key: password
                - name: RULES_DIR
                  value: "/etc/sigma"
                - name: LOOK_BACK_MINUTES
                  value: "6"
                - name: LOKI_LIMIT
                  value: "500"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: sigma-rules
                  mountPath: /etc/sigma/rules
                - name: nous-intel
                  mountPath: /etc/sigma/intel
                - name: sigma-script
                  mountPath: /scripts
          volumes:
            - name: sigma-rules
              configMap:
                name: sigma-rules
            - name: nous-intel
              persistentVolumeClaim:
                claimName: nous-intel
            - name: sigma-script
              configMap:
                name: sigma-scanner-script
                defaultMode: 0755
