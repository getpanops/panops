---
# Source: falco-talon/templates/deployment.yaml (chart 0.4.1, customised: replicas 2→1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-talon
  namespace: security
  labels:
    app.kubernetes.io/part-of: falco-talon
    app.kubernetes.io/name: falco-talon
    app.kubernetes.io/instance: falco-talon
    app.kubernetes.io/version: 0.3.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falco-talon
      app.kubernetes.io/instance: falco-talon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco-talon
        app.kubernetes.io/instance: falco-talon
    spec:
      serviceAccountName: falco-talon
      securityContext:
        runAsUser: 1234
        fsGroup: 1234
      restartPolicy: Always
      containers:
        - name: falco-talon
          image: "falco.docker.scarf.sh/falcosecurity/falco-talon:0.3.0"
          imagePullPolicy: IfNotPresent
          args: ["server", "-c", "/etc/falco-talon/config.yaml", "-r", "/etc/falco-talon/rules.yaml"]
          ports:
            - name: http
              containerPort: 2803
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/falco-talon/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: rules
              mountPath: /etc/falco-talon/rules.yaml
              subPath: rules.yaml
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: falco-talon-rules
        - name: config
          secret:
            secretName: falco-talon-config
