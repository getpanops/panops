apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-blackbox
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  blackbox-dashboard.json: |
    {
      "title": "Blackbox Exporter",
      "uid": "blackbox-exporter",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "tags": ["observability", "blackbox", "probes"],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Probe Success",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "hideFrom": { "tooltip": false, "viz": false, "legend": false }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "red", "value": 0 },
                  { "color": "green", "value": 1 }
                ]
              },
              "color": { "mode": "thresholds" }
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "probe_success{job=~\"$job\", instance=~\"$instance\"}",
              "format": "time_series",
              "legendFormat": "{{ job }} / {{ instance }}",
              "interval": "30s"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Probe Duration",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "lineInterpolation": "linear"
              },
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "probe_duration_seconds{job=~\"$job\", instance=~\"$instance\"}",
              "format": "time_series",
              "legendFormat": "{{ job }} / {{ instance }}",
              "interval": "30s"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "SSL Certificate Expiry",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 0,
                "showPoints": "always",
                "spanNulls": true,
                "lineInterpolation": "linear"
              },
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "red", "value": 86400 },
                  { "color": "yellow", "value": 604800 },
                  { "color": "green", "value": 2592000 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "probe_ssl_earliest_cert_expiry{job=~\"$job\", instance=~\"$instance\"} - time()",
              "format": "time_series",
              "legendFormat": "{{ job }} / {{ instance }}",
              "interval": "5m"
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(probe_success, job)",
            "description": "Job filter",
            "hide": 0,
            "includeAll": true,
            "label": "Job",
            "multi": true,
            "name": "job",
            "options": [],
            "query": { "query": "label_values(probe_success, job)", "refId": "job" },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "tagValuesQuery": "",
            "tagsQuery": "",
            "type": "query",
            "useTags": false
          },
          {
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(probe_success{job=~\"$job\"}, instance)",
            "description": "Instance filter",
            "hide": 0,
            "includeAll": true,
            "label": "Instance",
            "multi": true,
            "name": "instance",
            "options": [],
            "query": { "query": "label_values(probe_success{job=~\"$job\"}, instance)", "refId": "instance" },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "tagValuesQuery": "",
            "tagsQuery": "",
            "type": "query",
            "useTags": false
          }
        ]
      }
    }
