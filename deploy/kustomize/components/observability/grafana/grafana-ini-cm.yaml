apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ini
  namespace: observability
data:
  grafana.ini: |
    [server]
    domain = grafana.YOUR_DOMAIN
    root_url = https://grafana.YOUR_DOMAIN/
    serve_from_sub_path = false

    [analytics]
    reporting_enabled = false
    check_for_updates = false
    check_for_plugin_updates = false

    [security]
    disable_gravatar = true

    [users]
    allow_sign_up = false
    auto_assign_org = true
    auto_assign_org_role = Viewer

    [auth]
    disable_login_form = false

    [auth.anonymous]
    enabled = false

    [auth.generic_oauth]
    name = OIDC
    enabled = true
    auto_login = true
    allow_sign_up = true
    client_id = grafana
    scopes = openid profile email
    use_pkce = true
    auth_url = https://auth.YOUR_DOMAIN/application/o/authorize/
    token_url = http://CHANGE_ME_OIDC_PROVIDER.CHANGE_ME_NS.svc.cluster.local/application/o/token/
    api_url = http://CHANGE_ME_OIDC_PROVIDER.CHANGE_ME_NS.svc.cluster.local/application/o/userinfo/
    role_attribute_path = contains(groups[*], 'Admins') && 'Admin' || contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'
    role_attribute_strict = true

    [smtp]
    enabled = true
    host = $__env{GF_SMTP_HOST}
    user = $__env{GF_SMTP_USER}
    password = $__env{GF_SMTP_PASSWORD}
    from_address = $__env{GF_SMTP_FROM_ADDRESS}
    from_name = Grafana PanOps
    startTLS_policy = MandatoryStartTLS

    [log]
    mode = console
    level = info
