apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-contactpoints
  namespace: observability
data:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      # SRE and SOC alerts route through PanOps which gates and formats notifications
      # before forwarding to your notification channel of choice.
      - orgId: 1
        name: SRE Alerts
        receivers:
          - uid: sre-panops
            type: webhook
            settings:
              url: http://panops-assembler.panops.svc.cluster.local:8080/webhook
              httpMethod: POST
            disableResolveMessage: false

      - orgId: 1
        name: SOC Alerts
        receivers:
          - uid: soc-panops
            type: webhook
            settings:
              url: http://panops-assembler.panops.svc.cluster.local:8080/webhook
              httpMethod: POST
            disableResolveMessage: false

      # CVE alerts bypass PanOps — point at your preferred webhook (Slack, Teams, PagerDuty, etc.)
      - orgId: 1
        name: SOC CVE New
        receivers:
          - uid: soc-cve-new
            type: webhook
            settings:
              url: http://CHANGE_ME_CVE_WEBHOOK_URL
              httpMethod: POST
            disableResolveMessage: true

      - orgId: 1
        name: SOC CVE Digest
        receivers:
          - uid: soc-cve-digest
            type: webhook
            settings:
              url: http://CHANGE_ME_CVE_WEBHOOK_URL
              httpMethod: POST
            disableResolveMessage: true

      # PanOps infrastructure alerts — bypasses assembler so they still fire if assembler is down
      - orgId: 1
        name: NOC Alerts
        receivers:
          - uid: noc-webhook
            type: webhook
            settings:
              url: http://CHANGE_ME_NOC_WEBHOOK_URL
              httpMethod: POST
            disableResolveMessage: false

      - orgId: 1
        name: email-critical
        receivers:
          - uid: email-critical
            type: email
            settings:
              addresses: CHANGE_ME_ALERT_EMAIL
            disableResolveMessage: true

  muteTimes.yaml: |
    apiVersion: 1
    muteTimes:
      - orgId: 1
        name: outside-cve-digest-window
        time_intervals:
          - times:
              - start_time: "00:00"
                end_time: "05:44"
          - times:
              - start_time: "05:52"
                end_time: "24:00"

  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: SRE Alerts
        group_by: [alertname, namespace]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          # PanOps infrastructure alerts: bypass assembler, go direct to #noc
          - receiver: NOC Alerts
            matchers:
              - team = noc
            group_by: [alertname]
            group_wait: 10s
            group_interval: 5m
            repeat_interval: 30m

          # CVE digest: muted outside 05:44–05:52 UTC (3:14–3:22pm ADST), no resolve messages
          - receiver: SOC CVE Digest
            matchers:
              - alert_class = cve-digest
            group_by: [alertname]
            group_wait: 1m
            group_interval: 23h
            repeat_interval: 23h
            mute_time_intervals:
              - outside-cve-digest-window

          # New CVE: immediate, no mute, no resolve message — only fires when critical count increases vs 24h ago
          - receiver: SOC CVE New
            matchers:
              - alert_class = cve-new
            group_by: [alertname]
            group_wait: 10s
            group_interval: 1h
            repeat_interval: 24h

          - receiver: SOC Alerts
            matchers:
              - source = security
              - severity = critical
            group_by: [alertname, falco_rule, falco_priority]
            group_wait: 10s
            group_interval: 5m
            repeat_interval: 4h

          - receiver: SOC Alerts
            matchers:
              - source = security
            group_by: [alertname, falco_rule, falco_priority]
            group_wait: 10s
            group_interval: 5m
            repeat_interval: 1h

          - receiver: email-critical
            matchers:
              - severity = critical
              - alertname !~ "Blackbox.*|SLO.*"
            group_by: [alertname, severity]
            group_wait: 10s
            group_interval: 1h
            repeat_interval: 30m

          # SLO fast burn — page immediately (Pyrra severity=critical)
          - receiver: SRE Alerts
            matchers:
              - slo =~ ".+"
              - severity = critical
            group_by: [alertname, slo]
            group_wait: 10s
            group_interval: 5m
            repeat_interval: 1h

          # SLO slow burn — ticket rate (Pyrra severity=warning)
          - receiver: SRE Alerts
            matchers:
              - slo =~ ".+"
              - severity = warning
            group_by: [alertname, slo]
            group_wait: 5m
            group_interval: 30m
            repeat_interval: 8h

          # Critical SRE falls through to root SRE Alerts (Matrix only)
