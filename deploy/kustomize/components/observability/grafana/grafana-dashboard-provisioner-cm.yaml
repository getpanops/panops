apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioner
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: panops
      orgId: 1
      folder: Homelab
      type: file
      disableDeletion: false
      updateIntervalSeconds: 60
      options:
        path: /etc/grafana/dashboards/panops
    - name: mixins
      orgId: 1
      folder: Mixins
      type: file
      disableDeletion: false
      updateIntervalSeconds: 60
      options:
        path: /etc/grafana/dashboards/mixins
