apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-node
  namespace: observability
  labels:
    app: alloy-node
spec:
  selector:
    matchLabels:
      app: alloy-node
  template:
    metadata:
      labels:
        app: alloy-node
    spec:
      serviceAccountName: alloy-node
      hostNetwork: false
      dnsPolicy: ClusterFirst
      containers:
      - name: alloy
        image: grafana/alloy:v1.17.0
        args:
        - run
        - /etc/alloy/config.alloy
        - --server.http.listen-addr=0.0.0.0:12345
        - --storage.path=/var/lib/alloy/data
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: ALLOY_DEPLOY_MODE
          value: "daemonset"
        ports:
        - name: http-metrics
          containerPort: 12345
          protocol: TCP
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: tetragon-logs
          mountPath: /var/run/cilium/tetragon
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: alloy-node-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: tetragon-logs
        hostPath:
          path: /var/run/cilium/tetragon
