# Canary service availability SLO — generated by Pyrra from bool_gauge probe_success
- name: canary-availability-increase
  interval: 1m30s
  rules:
  - expr: sum by (__name__, instance, job) (count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[2w]))
    labels:
      slo: canary-availability
    record: probe_success:count2w
  - expr: sum by (__name__, instance, job) (sum_over_time(probe_success{instance="canary-service",job="blackbox/http"}[2w]))
    labels:
      slo: canary-availability
    record: probe_success:sum2w
  - alert: SLOMetricAbsent
    expr: absent(probe_success{instance="canary-service",job="blackbox/http"}) == 1
    for: 5m
    labels:
      severity: critical
      slo: canary-availability

- name: canary-availability
  interval: 30s
  rules:
  - expr: (sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[3m])) - sum(sum_over_time(probe_success{instance="canary-service",job="blackbox/http"}[3m]))) / sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[3m]))
    labels:
      instance: canary-service
      job: blackbox/http
      slo: canary-availability
    record: probe_success:burnrate3m
  - expr: (sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[15m])) - sum(sum_over_time(probe_success{instance="canary-service",job="blackbox/http"}[15m]))) / sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[15m]))
    labels:
      instance: canary-service
      job: blackbox/http
      slo: canary-availability
    record: probe_success:burnrate15m
  - expr: (sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[30m])) - sum(sum_over_time(probe_success{instance="canary-service",job="blackbox/http"}[30m]))) / sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[30m]))
    labels:
      instance: canary-service
      job: blackbox/http
      slo: canary-availability
    record: probe_success:burnrate30m
  - expr: (sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[1h])) - sum(sum_over_time(probe_success{instance="canary-service",job="blackbox/http"}[1h]))) / sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[1h]))
    labels:
      instance: canary-service
      job: blackbox/http
      slo: canary-availability
    record: probe_success:burnrate1h
  - expr: (sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[3h])) - sum(sum_over_time(probe_success{instance="canary-service",job="blackbox/http"}[3h]))) / sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[3h]))
    labels:
      instance: canary-service
      job: blackbox/http
      slo: canary-availability
    record: probe_success:burnrate3h
  - expr: (sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[12h])) - sum(sum_over_time(probe_success{instance="canary-service",job="blackbox/http"}[12h]))) / sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[12h]))
    labels:
      instance: canary-service
      job: blackbox/http
      slo: canary-availability
    record: probe_success:burnrate12h
  - expr: (sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[2d])) - sum(sum_over_time(probe_success{instance="canary-service",job="blackbox/http"}[2d]))) / sum(count_over_time(probe_success{instance="canary-service",job="blackbox/http"}[2d]))
    labels:
      instance: canary-service
      job: blackbox/http
      slo: canary-availability
    record: probe_success:burnrate2d
  - alert: CanaryAvailability
    expr: probe_success:burnrate3m{instance="canary-service",job="blackbox/http",slo="canary-availability"} > (14 * (1-0.99)) and probe_success:burnrate30m{instance="canary-service",job="blackbox/http",slo="canary-availability"} > (14 * (1-0.99))
    for: 1m
    labels:
      exhaustion: 1d
      instance: canary-service
      job: blackbox/http
      long: 30m
      severity: critical
      short: 3m
      slo: canary-availability
  - alert: CanaryAvailability
    expr: probe_success:burnrate15m{instance="canary-service",job="blackbox/http",slo="canary-availability"} > (7 * (1-0.99)) and probe_success:burnrate3h{instance="canary-service",job="blackbox/http",slo="canary-availability"} > (7 * (1-0.99))
    for: 8m
    labels:
      exhaustion: 2d
      instance: canary-service
      job: blackbox/http
      long: 3h
      severity: critical
      short: 15m
      slo: canary-availability
  - alert: CanaryAvailability
    expr: probe_success:burnrate1h{instance="canary-service",job="blackbox/http",slo="canary-availability"} > (2 * (1-0.99)) and probe_success:burnrate12h{instance="canary-service",job="blackbox/http",slo="canary-availability"} > (2 * (1-0.99))
    for: 30m
    labels:
      exhaustion: 1w
      instance: canary-service
      job: blackbox/http
      long: 12h
      severity: warning
      short: 1h
      slo: canary-availability
  - alert: CanaryAvailability
    expr: probe_success:burnrate3h{instance="canary-service",job="blackbox/http",slo="canary-availability"} > (1 * (1-0.99)) and probe_success:burnrate2d{instance="canary-service",job="blackbox/http",slo="canary-availability"} > (1 * (1-0.99))
    for: 1h30m
    labels:
      exhaustion: 2w
      instance: canary-service
      job: blackbox/http
      long: 2d
      severity: warning
      short: 3h
      slo: canary-availability

- name: canary-availability-generic
  interval: 30s
  rules:
  - expr: '0.99'
    labels:
      slo: canary-availability
    record: pyrra_objective
  - expr: '1209600'
    labels:
      slo: canary-availability
    record: pyrra_window
  - expr: sum(probe_success:sum2w{instance="canary-service",job="blackbox/http",slo="canary-availability"}) / sum(probe_success:count2w{instance="canary-service",job="blackbox/http",slo="canary-availability"})
    labels:
      slo: canary-availability
    record: pyrra_availability
  - expr: sum(probe_success:count2w{instance="canary-service",job="blackbox/http",slo="canary-availability"})
    labels:
      slo: canary-availability
    record: pyrra_requests:rate5m
  - expr: sum(probe_success:count2w{instance="canary-service",job="blackbox/http",slo="canary-availability"}) - sum(probe_success:sum2w{instance="canary-service",job="blackbox/http",slo="canary-availability"})
    labels:
      slo: canary-availability
    record: pyrra_errors:rate5m
