      sloth_service: aegis
      sloth_slo: requests-availability
      sloth_window: 2h
      team: platform
      tier: critical
    record: slo:sli_error:ratio_rate2h
  - expr: '(sum(rate(http_requests_total{namespace="aegis",code=~"5.."}[6h])))

      /

      (sum(rate(http_requests_total{namespace="aegis"}[6h])))

      '
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      sloth_window: 6h
      team: platform
      tier: critical
    record: slo:sli_error:ratio_rate6h
  - expr: '(sum(rate(http_requests_total{namespace="aegis",code=~"5.."}[1d])))

      /

      (sum(rate(http_requests_total{namespace="aegis"}[1d])))

      '
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      sloth_window: 1d
      team: platform
      tier: critical
    record: slo:sli_error:ratio_rate1d
  - expr: '(sum(rate(http_requests_total{namespace="aegis",code=~"5.."}[3d])))

      /

      (sum(rate(http_requests_total{namespace="aegis"}[3d])))

      '
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      sloth_window: 3d
      team: platform
      tier: critical
    record: slo:sli_error:ratio_rate3d
  - expr: 'sum_over_time(slo:sli_error:ratio_rate5m{sloth_id="aegis-requests-availability",
      sloth_service="aegis", sloth_slo="requests-availability"}[30d])

      / ignoring (sloth_window)

      count_over_time(slo:sli_error:ratio_rate5m{sloth_id="aegis-requests-availability",
      sloth_service="aegis", sloth_slo="requests-availability"}[30d])

      '
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      sloth_window: 30d
      team: platform
      tier: critical
    record: slo:sli_error:ratio_rate30d
- name: sloth-slo-meta-recordings-aegis-requests-availability
  rules:
  - expr: vector(0.9990000000000001)
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      team: platform
      tier: critical
    record: slo:objective:ratio
  - expr: vector(1-0.9990000000000001)
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      team: platform
      tier: critical
    record: slo:error_budget:ratio
  - expr: vector(30)
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      team: platform
      tier: critical
    record: slo:time_period:days
  - expr: 'slo:sli_error:ratio_rate5m{sloth_id="aegis-requests-availability", sloth_service="aegis",
      sloth_slo="requests-availability"}

      / on(sloth_id, sloth_slo, sloth_service) group_left

      slo:error_budget:ratio{sloth_id="aegis-requests-availability", sloth_service="aegis",
      sloth_slo="requests-availability"}

      '
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      team: platform
      tier: critical
    record: slo:current_burn_rate:ratio
  - expr: 'slo:sli_error:ratio_rate30d{sloth_id="aegis-requests-availability", sloth_service="aegis",
      sloth_slo="requests-availability"}

      / on(sloth_id, sloth_slo, sloth_service) group_left

      slo:error_budget:ratio{sloth_id="aegis-requests-availability", sloth_service="aegis",
      sloth_slo="requests-availability"}

      '
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      team: platform
      tier: critical
    record: slo:period_burn_rate:ratio
  - expr: 1 - slo:period_burn_rate:ratio{sloth_id="aegis-requests-availability", sloth_service="aegis",
      sloth_slo="requests-availability"}
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      team: platform
      tier: critical
    record: slo:period_error_budget_remaining:ratio
  - expr: vector(1)
    labels:
      sloth_id: aegis-requests-availability
      sloth_mode: cli-gen-k8s
      sloth_objective: '99.9'
      sloth_service: aegis
      sloth_slo: requests-availability
      sloth_spec: sloth.slok.dev/v1
      sloth_version: v0.16.0
      team: platform
      tier: critical
    record: sloth_slo_info
- name: sloth-slo-alerts-aegis-requests-availability
  rules:
  - alert: AegisHighErrorRate
    annotations:
      summary: Aegis error rate exceeds SLO budget
      title: (page) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
        burn rate is too fast.
    expr: "(\n    max(slo:sli_error:ratio_rate5m{sloth_id=\"aegis-requests-availability\"\
      , sloth_service=\"aegis\", sloth_slo=\"requests-availability\"} > (14.4 * 0.0009999999999999432))\
      \ without (sloth_window)\n    and\n    max(slo:sli_error:ratio_rate1h{sloth_id=\"\
      aegis-requests-availability\", sloth_service=\"aegis\", sloth_slo=\"requests-availability\"\
      } > (14.4 * 0.0009999999999999432)) without (sloth_window)\n)\nor\n(\n    max(slo:sli_error:ratio_rate30m{sloth_id=\"\
      aegis-requests-availability\", sloth_service=\"aegis\", sloth_slo=\"requests-availability\"\
      } > (6 * 0.0009999999999999432)) without (sloth_window)\n    and\n    max(slo:sli_error:ratio_rate6h{sloth_id=\"\
      aegis-requests-availability\", sloth_service=\"aegis\", sloth_slo=\"requests-availability\"\
      } > (6 * 0.0009999999999999432)) without (sloth_window)\n)\n"
    labels:
      severity: critical
      sloth_severity: page
  - alert: AegisHighErrorRate
    annotations:
      summary: Aegis error rate exceeds SLO budget
      title: (ticket) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
        burn rate is too fast.
    expr: "(\n    max(slo:sli_error:ratio_rate2h{sloth_id=\"aegis-requests-availability\"\
      , sloth_service=\"aegis\", sloth_slo=\"requests-availability\"} > (3 * 0.0009999999999999432))\
      \ without (sloth_window)\n    and\n    max(slo:sli_error:ratio_rate1d{sloth_id=\"\
      aegis-requests-availability\", sloth_service=\"aegis\", sloth_slo=\"requests-availability\"\
      } > (3 * 0.0009999999999999432)) without (sloth_window)\n)\nor\n(\n    max(slo:sli_error:ratio_rate6h{sloth_id=\"\
      aegis-requests-availability\", sloth_service=\"aegis\", sloth_slo=\"requests-availability\"\
      } > (1 * 0.0009999999999999432)) without (sloth_window)\n    and\n    max(slo:sli_error:ratio_rate3d{sloth_id=\"\
      aegis-requests-availability\", sloth_service=\"aegis\", sloth_slo=\"requests-availability\"\
      } > (1 * 0.0009999999999999432)) without (sloth_window)\n)\n"
    labels:
      severity: warning
      sloth_severity: ticket
