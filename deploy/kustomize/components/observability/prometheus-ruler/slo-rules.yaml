groups:
- name: sloth-slo-sli-recordings-aegis-requests-availability
  rules:
  - expr: '(sum(rate(http_requests_total{namespace="aegis",code=~"5.."}[5m])))

      /

      (sum(rate(http_requests_total{namespace="aegis"}[5m])))

      '
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      sloth_window: 5m
      team: platform
      tier: critical
    record: slo:sli_error:ratio_rate5m
  - expr: '(sum(rate(http_requests_total{namespace="aegis",code=~"5.."}[30m])))

      /

      (sum(rate(http_requests_total{namespace="aegis"}[30m])))

      '
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      sloth_window: 30m
      team: platform
      tier: critical
    record: slo:sli_error:ratio_rate30m
  - expr: '(sum(rate(http_requests_total{namespace="aegis",code=~"5.."}[1h])))

      /

      (sum(rate(http_requests_total{namespace="aegis"}[1h])))

      '
    labels:
      sloth_id: aegis-requests-availability
      sloth_service: aegis
      sloth_slo: requests-availability
      sloth_window: 1h
      team: platform
      tier: critical
    record: slo:sli_error:ratio_rate1h
  - expr: '(sum(rate(http_requests_total{namespace="aegis",code=~"5.."}[2h])))

      /

      (sum(rate(http_requests_total{namespace="aegis"}[2h])))

      '
