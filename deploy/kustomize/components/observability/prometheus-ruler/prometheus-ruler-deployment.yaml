apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-ruler
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-ruler
  template:
    metadata:
      labels:
        app: prometheus-ruler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v3.4.1
        args:
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.path=/tmp/prometheus
          - --storage.tsdb.retention.time=2h
          - --web.listen-address=0.0.0.0:9090
          - --log.level=warn
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: rules
          mountPath: /etc/prometheus/rules
        - name: tsdb
          mountPath: /tmp/prometheus
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      - name: config
        configMap:
          name: prometheus-ruler-config
      - name: rules
        configMap:
          name: prometheus-ruler-rules
      - name: tsdb
        emptyDir: {}
