apiVersion: batch/v1
kind: Job
metadata:
  name: panops-schema-init
  namespace: panops
  annotations:
    description: "One-shot Job: creates panops DB + all PanOps Brain tables in ClickHouse"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: schema-init
        image: python:3.12-slim
        command: ["python", "/scripts/schema.py"]
        env:
        - name: CH_HOST
          value: "observability-clickhouse-clickhouse-headless.observability.svc.cluster.local:8123"
        - name: CH_USER
          value: "default"
        - name: CH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-password
              key: password
        - name: CH_URL
          value: "http://$(CH_HOST)/"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: panops-schema-sql
