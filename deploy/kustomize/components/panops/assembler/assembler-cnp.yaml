apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: panops-assembler
  namespace: panops
spec:
  endpointSelector:
    matchLabels:
      app: panops-assembler

  ingress:
  # Grafana webhook (observability namespace)
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: observability
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP

  egress:
  # pip install + fastembed model download (HuggingFace, PyPI) at container startup
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "80"
        protocol: TCP

  # DNS
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP

  # ClickHouse HTTP API
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: observability
    toPorts:
    - ports:
      - port: "8123"
        protocol: TCP

  # Loki query API + Prometheus query API (gigapipe)
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: observability
        app: gigapipe
    toPorts:
    - ports:
      - port: "3100"
        protocol: TCP

  # Kubernetes API server — assembler spawns LLM Jobs via Python client
  - toEntities:
    - kube-apiserver
