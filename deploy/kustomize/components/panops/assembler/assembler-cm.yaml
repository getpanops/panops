                return True
            p_parts = predicted.split("_")
            a_parts = actual.split("_")
            return len(p_parts) > 0 and p_parts[0] == a_parts[0]

        matched = _route_matches(predicted_route, rule_name)
        score = 1.0 if matched else 0.0

