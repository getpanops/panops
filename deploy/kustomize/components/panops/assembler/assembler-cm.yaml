            req.add_header("Content-Type", "text/plain")
            req.add_header("X-ClickHouse-User", os.getenv("CH_USER", "default"))
            req.add_header("X-ClickHouse-Key",  os.getenv("CH_PASSWORD", ""))
            with urllib.request.urlopen(req, timeout=15) as r:
                r.read()
