apiVersion: v1
kind: ConfigMap
metadata:
  name: panops-llm-job-template
  namespace: panops
data:
  job-template.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: panops-llm-HAPPENING_ID
      namespace: panops
      labels:
        app: panops-llm-job
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: panops-llm-job
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: infer
              image: ghcr.io/getpanops/panops/llm-worker:latest
              env:
                - name: HAPPENING_ID
                  value: "HAPPENING_ID"
                - name: CH_URL
                  value: "http://observability-clickhouse-clickhouse-headless.observability.svc.cluster.local:8123/"
                - name: CH_USER
                  value: "default"
                - name: CH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-password
                      key: password
                - name: MODEL_PATH
                  value: "/models/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
                - name: LLM_CONFIDENCE_THRESHOLD
                  value: "0.6"
              resources:
                requests:
                  cpu: 2000m
                  memory: 3Gi
                limits:
                  cpu: 4000m
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: models
                  mountPath: /models
                  readOnly: true
          volumes:
            - name: models
              persistentVolumeClaim:
                claimName: panops-model-pvc
          serviceAccountName: panops-llm-sa
