apiVersion: apps/v1
kind: Deployment
metadata:
  name: coroot-operator
  namespace: observability
  labels:
    app.kubernetes.io/name: coroot-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: coroot-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coroot-operator
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: coroot-operator
      containers:
        - name: operator
          image: "ghcr.io/coroot/coroot-operator:1.9.3"
          imagePullPolicy: IfNotPresent
          securityContext:
            {}
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
