receivers:

  # ── Docker container logs ─────────────────────────────────────────────────
  filelog/containers:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: beginning
    include_file_path: true
    include_file_name: false
    operators:
      # Parse Docker JSON log envelope ({"log":"...","stream":"...","time":"..."})
      - type: json_parser
        id: docker-json
        timestamp:
          parse_from: attributes.time
          layout: "2006-01-02T15:04:05.999999999Z"
          layout_type: gotime
      - type: move
        from: attributes.log
        to: body
      # Extract container name from the file path
      # Path format: /var/lib/docker/containers/<id>/<id>-json.log
      - type: regex_parser
        id: container-id
        regex: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/'
        parse_to: attributes

  # ── Host-level metrics ────────────────────────────────────────────────────
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:    {}
      memory: {}
      disk:   {}
      filesystem:
        exclude_mount_points:
          mount_points: ["^/proc", "^/sys", "^/dev"]
          match_type: regexp
      network: {}
      load:    {}

  # ── Self-metrics ──────────────────────────────────────────────────────────
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otelcol
          static_configs:
            - targets: [localhost:8888]

processors:
  batch:
    send_batch_size: 1000
    timeout: 5s

  # Add host metadata as resource attributes
  resourcedetection:
    detectors: [env, system]
    timeout: 5s
    override: false

  # Promote exporter label so the Loki stream is never empty {} —
  # qryn rejects empty stream selectors as invalid LogQL.
  transform/loki-hints:
    log_statements:
      - context: log
        statements:
          - set(log.attributes["loki.attribute.labels"], "container_id")

exporters:
  # Logs → Gigapipe Loki endpoint
  loki:
    endpoint: http://gigapipe:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: true
      job: false

  # Metrics → Gigapipe Prometheus remote write
  prometheusremotewrite:
    endpoint: http://gigapipe:3100/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    logs/containers:
      receivers:  [filelog/containers]
      processors: [resourcedetection, transform/loki-hints, batch]
      exporters:  [loki]

    metrics/host:
      receivers:  [hostmetrics, prometheus/self]
      processors: [resourcedetection, batch]
      exporters:  [prometheusremotewrite]
